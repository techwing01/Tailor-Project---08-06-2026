name: TailorMate CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP syntax check
        run: |
          set -e

          for f in *.php includes/*.php; do
            php -l "$f"
          done

      - name: Validate Docker Compose
        run: |
          docker compose config -q

      - name: Build Docker image
        run: |
          docker compose build web

      - name: Secret scan
        run: |
          set -e

          if grep -RniE \
            'root_secret_123|tailormate_pass|password123|admin123|re_[A-Za-z0-9]{20,}' \
            . \
            --exclude-dir=.git \
            --exclude-dir=backups \
            --exclude=.env \
            --exclude-dir=.github \
            --exclude='*.sql' \
            --exclude='*.tar.gz'; then
              echo "ERROR: Potential secret found"
              exit 1
          fi

          echo "OK: No known secrets found"
